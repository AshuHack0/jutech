<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Crawler directives -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./JutechFavicon.ico" />

    <!-- Canonical URL (avoid duplicate content) -->
    <link rel="canonical" href="https://jutech.co/" />
    <link rel="sitemap" type="application/xml" href="https://jutech.co/sitemap.xml" />

    <!-- Theme color (browser UI) -->
    <meta name="theme-color" content="#6D39F3" />

    <!-- Primary meta -->
    <title>JuTech | Software Technology Development Company & Digital Solutions</title>
    <meta
      name="description"
      content="JuTech — Build Beyond Limits. We specialize in software technology development, web and mobile apps, cloud integration, and digital solutions that empower your business growth."
    />
    <meta
      name="keywords"
      content="software technology development, software development company, web app development, mobile app development, cloud solutions, SaaS development, UI UX design, API integration, software architecture, backend development, frontend development, agile software development, digital transformation, enterprise software, automation solutions, full-stack development, AI development, machine learning, data analytics, IoT solutions, blockchain development, software maintenance, QA testing"
    />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jutech.co/" />
    <meta property="og:title" content="JuTech — Build Beyond Limits | Software Technology Development Solutions" />
    <meta
      property="og:description"
      content="Empowering businesses with scalable, custom-built software technology development solutions. Explore JuTech's expertise in web, mobile, cloud, and enterprise applications."
    />
    <meta property="og:image" content="https://jutech.co/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JuTech — Software Technology Development Company" />
    <meta property="og:site_name" content="JuTech" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JuTech — Build Beyond Limits | Software Development Solutions" />
    <meta name="twitter:description" content="Custom software, cloud, and digital solutions built to scale your business beyond limits." />
    <meta name="twitter:image" content="https://jutech.co/og-image.jpg" />
    <meta name="twitter:image:alt" content="JuTech — Software Technology Development Company" />

    <!-- Schema.org: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "JuTech",
        "url": "https://jutech.co",
        "logo": "https://jutech.co/og-image.jpg",
        "sameAs": [
          "https://www.linkedin.com/company/jutech",
          "https://twitter.com/jutech"
        ],
        "description": "JuTech provides software technology development solutions for businesses seeking scalable, innovative, and high-performance digital products."
      }
    </script>
    <!-- Schema.org: WebSite + WebPage (homepage) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "JuTech",
        "url": "https://jutech.co",
        "description": "Software technology development company. Build beyond limits with web, mobile, cloud, and digital solutions.",
        "publisher": {
          "@type": "Organization",
          "name": "JuTech",
          "logo": { "@type": "ImageObject", "url": "https://jutech.co/og-image.jpg" }
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "JuTech | Software Technology Development Company & Digital Solutions",
        "url": "https://jutech.co/",
        "description": "JuTech — Build Beyond Limits. Software development, web and mobile apps, cloud integration, and digital solutions for business growth.",
        "isPartOf": { "@type": "WebSite", "url": "https://jutech.co" }
      }
    </script>
  </head>

  <body>
    <!-- ✅ Added: SEO-friendly fallback content for React apps -->
    <noscript>
      <h1>Software Technology Development Company | JuTech</h1>
      <p>
        JuTech specializes in software technology development, offering custom
        web, mobile, and enterprise solutions to help businesses innovate and
        grow in the digital era.
      </p>
    </noscript>

    <!-- ✅ React root container -->
    <div id="root"></div>

    <!-- ✅ Fixed: Main JS entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
