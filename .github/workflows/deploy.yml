# Build and deploy JuTech to GitHub Pages (with prerender for SEO)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # GitHub Pages project site: https://<user>.github.io/<repo>/
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (for prerender)
        run: |
          npx @puppeteer/browsers install chromium@latest --path /tmp/chromium
          CHROME_PATH=$(find /tmp/chromium -name chrome -type f 2>/dev/null | head -1)
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::Chromium binary not found under /tmp/chromium"
            find /tmp/chromium -type f 2>/dev/null || true
            exit 1
          fi
          chmod +x "$CHROME_PATH"
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> $GITHUB_ENV
          echo "Using Chromium at: $CHROME_PATH"

      - name: Build (with prerender)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
